apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway-container
        image: travel-ease-gateway-service:v1.7
        ports: 
          - containerPort: 9090
        env:
          - name: SERVICES_BOOKING_URL
            value: "http://booking-service:8080"
          - name: SERVICES_HOTEL_URL
            value: "http://hotel-service:8080"
          - name: SERVICES_USER_URL
            value: "http://user-service:8081"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  type: LoadBalancer 
  selector:
    app: gateway
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
