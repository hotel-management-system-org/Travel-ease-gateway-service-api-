spring.application.name=gateway-service-api

server.port=9090

spring.cloud.gateway.discovery.locator.enabled=false

keycloak.realm=hotel-management-realm
keycloak.auth-issure-uri=http://keycloak-service:8080/realms/hotel-management-realm
keycloak.client=travel-ease-client

logging.level.root=INFO
logging.level.com.example.demo=DEBUG
logging.level.com.example.demo.filter=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web.reactive=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n


management.endpoints.web.exposure.include=health,info,metrics,gateway,routes
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true

services.booking-url=http://booking-service:8083
services.hotel-url=http://hotel-service:8082
services.user-url=http://user-service:8081